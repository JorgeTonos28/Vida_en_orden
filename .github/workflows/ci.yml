name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run test:finance
      - run: npm run test:mcp
      - run: npm run test:audit
      - run: npm run test:recovery
      - run: npm run audit:public
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run verify:schema
      - run: npm run build
      - run: npm run verify:independent
      - run: npm run verify:worker
      - run: npm run verify:sites
      - run: npm run verify:upgrade
      - name: Scan for common credential patterns
        shell: bash
        run: |
          pattern='(^|[[:space:]="])(sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|Bearer[[:space:]]+[A-Za-z0-9._~-]{20,})'
          if git grep -l -I -E "$pattern" -- . ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo 'Potential credential pattern found.'
            exit 1
          fi
